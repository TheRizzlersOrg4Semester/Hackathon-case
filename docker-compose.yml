services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: pulsefund
      POSTGRES_USER: pulsefund
      POSTGRES_PASSWORD: supersecret
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://pulsefund:supersecret@db:5432/pulsefund?schema=public
      NODE_ENV: production
      PORT: 3000
    command: sh -c "npx prisma migrate deploy && node prisma/seed.js && npm run start"

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
